name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # The build inlines VITE_* at compile time, so we provide placeholders.
      # The app must boot (and show its "falta configuración" notice) without
      # real credentials, so the build never depends on a Supabase project.
      - name: Variables de entorno
        run: cp .env.example .env

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm run test

      - name: Build
        run: npm run build
