name: Mantener actividad en Supabase

on:
  schedule:
    # Cuatro consultas diarias, fuera del inicio de la hora para evitar congestión.
    - cron: "17 */6 * * *"
  workflow_dispatch:

# La petición solo consulta datos públicos; no necesita leer el repositorio.
permissions: {}

jobs:
  consultar:
    name: Consultar un mazo público
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Generar actividad de base de datos
        env:
          # Reutiliza las mismas variables o secretos del despliegue de Pages.
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_KEY" ]]; then
            echo "::error::Configura VITE_SUPABASE_URL y VITE_SUPABASE_PUBLISHABLE_KEY en las variables o secretos de Actions."
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 5 --connect-timeout 10 --max-time 20 \
            --header "apikey: $SUPABASE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/decks?select=id&visibility=eq.public&limit=1" \
            --output /dev/null
